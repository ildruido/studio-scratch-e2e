name: Release tag

# Tags every release by itself, so nobody pushes tags by hand (a cloud session's git proxy refuses them).
# A release is a commit on main that changes "version" in package.json (the release skill's PR). This job
# creates the annotated tag vX.Y.Z on that commit and a GitHub release with that version's CHANGELOG
# section. An existing tag is never moved. Ordinary merges stop at the first step and cost seconds.
# The bootstrap commit that first adds package.json (version 0.0.0) is not a release.
# Run by hand (Actions > Release tag > Run workflow, on main), it tags the commit that last changed the
# version, not the newest commit: the way to create a tag that is still missing.
# A job that needs the tag (the mirror pack's public mirror) starts when this workflow finishes, not on the
# tag push: a tag made with the workflow's own token starts no other workflow.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Was this a release?
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          now=$(node -p "require('./package.json').version")
          echo "tag=v$now" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this on main."
              exit 1
            fi
            sha=$(git log -1 --format=%H -G'"version"' -- package.json)
            echo "Run by hand: v$now goes on $sha, the commit that set that version."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare with what main held before this push (a push can carry several commits).
          before=$(git show "$BEFORE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo none)
          echo "version before: $before, now: $now"
          if [ "$before" != "none" ] && [ "$now" != "$before" ] && [ "$now" != "0.0.0" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release commit
        if: steps.release.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Tagged ${SHA:0:7} as $TAG."
          if [ "$SHA" != "$(git rev-parse HEAD)" ]; then
            echo "The tag is on an older commit: start any job that follows a release by hand with this tag (for example Actions > Mirror > Run workflow)."
          fi

      - name: GitHub release with the changelog section
        if: steps.release.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          git show "$SHA:CHANGELOG.md" 2> /dev/null | awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { f = 1; next } f && /^## \[/ { exit } f' > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "See CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
